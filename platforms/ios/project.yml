name: FloristAI
options:
  bundleIdPrefix: com.floristai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  FloristAI:
    type: application
    platform: iOS
    sources:
      - path: FloristAI
    preBuildScripts:
      # Aplikacja ma jedno zrodlo prawdy: florist/app/index.html.
      # Uwaga: przed "xcodegen generate" uruchom "node scripts/sync-app.mjs",
      # zeby plik istnial i trafil do Copy Bundle Resources.
      - name: Sync Florist app
        script: |
          mkdir -p "$SRCROOT/FloristAI/Resources"
          cp "$SRCROOT/../../app/index.html" "$SRCROOT/FloristAI/Resources/index.html"
        outputFiles:
          - $(SRCROOT)/FloristAI/Resources/index.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.floristai.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Florist
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Aparat sluzy do robienia zdjec roslin do rozpoznania w Pracowni AI."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Dostep do zdjec pozwala wybrac zdjecie rosliny do rozpoznania."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Zapis wygenerowanych grafik do biblioteki zdjec."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
